<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to TCX Connect</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#1a1f36; padding:24px 32px;">
              <span style="color:#ffffff; font-size:18px; font-weight:bold;">TCX Connect</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 16px; font-size:15px; color:#1a1f36;">{{ greeting }}</p>
              <p style="margin:0 0 16px; font-size:15px; color:#1a1f36;">Your account has been created.</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; border-radius:6px; margin:0 0 16px;">
                <tr>
                  <td style="padding:16px;">
                    <p style="margin:0 0 8px; font-size:14px; color:#4b5563;">Email</p>
                    <p style="margin:0 0 16px; font-size:15px; color:#1a1f36; font-weight:bold;">{{ email }}</p>
                    <p style="margin:0 0 8px; font-size:14px; color:#4b5563;">Password</p>
                    <p style="margin:0; font-size:15px; color:#1a1f36; font-weight:bold; font-family:monospace;">{{ plaintext_password }}</p>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 16px; font-size:15px; color:#1a1f36;">{{ password_line }}</p>
              <p style="margin:0; font-size:13px; color:#6b7280;">If you did not expect this email, please contact your administrator.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
